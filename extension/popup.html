<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Субтитры UN Web TV</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Субтитры UN Web TV</h1>

      <label for="mode">Распознавание</label>
      <select id="mode">
        <option value="local">Локальный WhisperX</option>
        <option value="cloud">Облачный сервис</option>
      </select>

      <label class="check">
        <input id="liveStream" type="checkbox"> Онлайн-трансляция
      </label>
      <small>Для прямого эфира; обычную запись оставьте без галочки.</small>

      <label for="translateTo">Перевод</label>
      <select id="translateTo">
        <option value="">Без перевода</option>
        <option value="ru">Русский</option>
      </select>

      <label for="translationEngine">Движок перевода</label>
      <select id="translationEngine">
        <option value="opus">Opus MT (лучше качество)</option>
        <option value="argos">Argos Translate</option>
      </select>

      <label for="captionOffset">Сдвиг субтитров (секунды)</label>
      <input id="captionOffset" type="number" min="-3" max="3" step="0.1" value="0">
      <small>− раньше · + позже</small>

      <label class="check"><input id="tts" type="checkbox"> Озвучка</label>

      <label for="ttsSource">Что озвучивать</label>
      <select id="ttsSource">
        <option value="translation">Перевод</option>
        <option value="original">Оригинал</option>
      </select>

      <label for="ttsProvider">Движок озвучки</label>
      <select id="ttsProvider">
        <option value="browser">Браузер</option>
        <option value="edge">Edge TTS</option>
      </select>

      <section id="browserTtsSettings" class="engine-settings" hidden>
        <label for="browserVoice">Голос браузера</label>
        <select id="browserVoice">
          <option value="">Голос по умолчанию</option>
        </select>

        <label for="browserRate">Скорость <output id="browserRateValue">1,0×</output></label>
        <input id="browserRate" type="range" min="0.5" max="2" step="0.1" value="1">

        <label for="browserPitch">Высота тона <output id="browserPitchValue">1,0</output></label>
        <input id="browserPitch" type="range" min="0" max="2" step="0.1" value="1">

        <label for="browserVolume">Громкость речи <output id="browserVolumeValue">100%</output></label>
        <input id="browserVolume" type="range" min="0" max="1" step="0.05" value="1">
      </section>

      <section id="edgeTtsSettings" class="engine-settings" hidden>
        <label for="ttsVoice">Голос Edge</label>
        <select id="ttsVoice">
          <option value="">Загружаю голоса…</option>
        </select>

        <label for="edgeRate">Скорость <output id="edgeRateValue">+0%</output></label>
        <input id="edgeRate" type="range" min="-50" max="50" step="5" value="0">

        <label for="edgePitch">Высота тона <output id="edgePitchValue">+0 Гц</output></label>
        <input id="edgePitch" type="range" min="-50" max="50" step="5" value="0">

        <label for="edgeVolume">Громкость речи <output id="edgeVolumeValue">+0%</output></label>
        <input id="edgeVolume" type="range" min="-50" max="50" step="5" value="0">
      </section>

      <label for="apiUrl">Адрес API</label>
      <input id="apiUrl" type="url" value="http://127.0.0.1:8000">

      <button id="prepare">Подготовить субтитры</button>
      <button id="stopLive" type="button" hidden>Остановить онлайн-трансляцию</button>
      <p id="status" role="status">Готово</p>
      <script src="popup-tts-settings.js"></script>
      <script src="popup.js"></script>
    </main>
  </body>
</html>
